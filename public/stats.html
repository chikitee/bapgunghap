<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>MT궁합 조회수</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b23a2b'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23fbefe6' font-family='serif' font-weight='900'%3E%E5%90%88%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --paper: #f4efe4; --paper-deep: #ebe3d2; --card: #fbf8f1;
      --ink: #1f1c18; --ink-soft: #5b544a; --ink-faint: #8f877a; --line: #d9cfbb;
      --seal: #b23a2b; --seal-deep: #8e2c20;
      --wood: #4f7a52; --fire: #c2462f; --earth: #b88a3e; --metal: #8a8f96; --water: #2f4a6b;
      --shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 18px 40px -24px rgba(60,40,10,.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: var(--paper); color: var(--ink);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      line-height: 1.6; word-break: keep-all;
    }
    main { max-width: 760px; margin: 0 auto; padding: 40px 16px 72px; }
    header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
    .seal {
      width: 44px; height: 44px; border-radius: 10px; background: var(--seal); color: #fbefe6;
      display: grid; place-items: center; font-family: "Noto Serif KR", serif; font-weight: 900; font-size: 22px;
      transform: rotate(-4deg);
    }
    h1 { font-family: "Noto Serif KR", serif; font-weight: 900; font-size: 26px; margin: 0; }
    header p { margin: 0; color: var(--ink-faint); font-size: 14px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 18px;
      box-shadow: var(--shadow); padding: 22px; margin-bottom: 16px;
    }
    .card h2 { font-family: "Gowun Batang", serif; font-size: 19px; margin: 0 0 12px; }
    .row { display: flex; gap: 8px; }
    input {
      flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 12px 14px; min-height: 48px;
      border: 1.5px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink);
    }
    input:focus { outline: none; border-color: var(--ink); }
    .btn {
      border: 0; border-radius: 12px; background: var(--ink); color: var(--paper);
      font: inherit; font-weight: 700; padding: 0 20px; min-height: 48px; cursor: pointer;
    }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn.big { width: 100%; min-height: 56px; font-size: 17px; }
    .btn .spinner {
      display: inline-block; width: 16px; height: 16px; margin-right: 8px; vertical-align: -3px;
      border: 2px solid rgba(244,239,228,.35); border-top-color: var(--paper); border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { display: none; margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #f8e5df; color: var(--seal-deep); font-size: 14px; }
    .error.show { display: block; }
    .muted { color: var(--ink-faint); font-size: 14px; margin: 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px;
      background: #fff; border: 1px solid var(--line); font-size: 14px;
    }
    .chip .g { font-size: 12px; font-weight: 700; }
    .chip .g.f { color: var(--fire); } .chip .g.m { color: var(--water); }
    .chip.warn { border-color: var(--seal); }
    .chip .x {
      border: 0; background: none; padding: 0 2px 0 4px; margin-left: 2px; min-width: 24px; min-height: 24px;
      font-size: 17px; line-height: 1; color: var(--ink-faint); cursor: pointer;
    }
    .chip .x:hover { color: var(--seal); }
    .chip.off { opacity: .45; text-decoration: line-through; }
    .chip .nm { cursor: pointer; }
    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .stat { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px; text-align: center; }
    .stat b { display: block; font-family: "Noto Serif KR", serif; font-size: 26px; font-weight: 900; line-height: 1.2; }
    .stat span { font-size: 12.5px; color: var(--ink-faint); }
    .groups { display: grid; gap: 12px; }
    .group { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
    .group-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .group h3 { font-family: "Gowun Batang", serif; font-size: 19px; margin: 0; }
    .score { font-size: 13px; color: var(--seal); font-weight: 700; white-space: nowrap; }
    .group p { margin: 10px 0 0; color: var(--ink-soft); font-size: 14.5px; }
    details { margin-top: 16px; }
    summary { cursor: pointer; font-weight: 600; color: var(--ink-soft); }
    [hidden] { display: none !important; }
    @media (max-width: 480px) { .summary { grid-template-columns: 1fr 1fr 1fr; } .stat b { font-size: 21px; } }
      table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
    th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; }
    th { color: var(--ink-faint); font-weight: 600; font-size: 13px; }
    td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
    tr:last-child td { border-bottom: 0; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
    .top h2 { margin: 0; }
    .ghost { background: none; color: var(--ink-soft); border: 1px solid var(--line); min-height: 36px; padding: 0 12px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="seal">合</div>
      <div><h1>MT궁합 조회수</h1><p>링크를 몇 번 열고 결과를 몇 번 봤는지</p></div>
    </header>

    <section class="card" id="login">
      <h2>운영자 확인</h2>
      <form class="row" id="login-form">
        <input type="password" id="password" placeholder="운영자 비밀번호" autocomplete="current-password" required>
        <button class="btn" type="submit">확인</button>
      </form>
      <div class="error" id="login-error" role="alert"></div>
    </section>

    <section id="board" hidden>
      <div class="summary">
        <div class="stat"><b id="opens"></b><span>링크 열람<br>오늘 <span id="opens-today"></span></span></div>
        <div class="stat"><b id="devices"></b><span>열어 본 기기<br>(대략 인원)</span></div>
        <div class="stat"><b id="results"></b><span>결과 조회<br>오늘 <span id="results-today"></span></span></div>
      </div>
      <section class="card">
        <div class="top"><h2>날짜별</h2><button class="btn ghost" id="refresh" type="button">새로고침</button></div>
        <table><thead><tr><th>날짜</th><th class="n">링크 열람</th><th class="n">결과 조회</th></tr></thead><tbody id="daily"></tbody></table>
      </section>
      <section class="card">
        <h2>사람별 결과 조회</h2>
        <table><thead><tr><th>이름</th><th class="n">조회</th></tr></thead><tbody id="people"></tbody></table>
      </section>
      <p class="muted">링크 열람은 초대 링크를 연 횟수, 결과 조회는 이름·생일을 넣고 결과를 본 횟수예요(처음 입력 포함). 이름·IP는 남기지 않아요.</p>
    </section>

    <section class="card" id="not-ready" hidden>
      <h2>아직 집계 전이에요</h2>
      <p class="muted">잠시 후 새로고침해 주세요.</p>
    </section>
  </main>

  <script>
    let password = '';
    try { password = sessionStorage.getItem('bap-admin') || ''; } catch {}
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const md = (d) => `${Number(d.slice(5, 7))}월 ${Number(d.slice(8, 10))}일`;

    async function load() {
      const res = await fetch('/api/group', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-password': password },
        body: JSON.stringify({ action: 'views' }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || '문제가 생겼어요.');
      try { sessionStorage.setItem('bap-admin', password); } catch {}
      $('login').hidden = true;
      $('not-ready').hidden = data.ready;
      $('board').hidden = !data.ready;
      if (!data.ready) return;
      $('opens').textContent = `${data.opens}회`;
      $('opens-today').textContent = `${data.opensToday}회`;
      $('devices').textContent = `${data.openDevices}대`;
      $('results').textContent = `${data.results}회`;
      $('results-today').textContent = `${data.resultsToday}회`;
      $('daily').innerHTML = data.daily.map((d) => `<tr><td>${md(d.date)}</td><td class="n">${d.opens}</td><td class="n">${d.results}</td></tr>`).join('')
        || '<tr><td colspan="3" class="muted">아직 기록이 없어요.</td></tr>';
      $('people').innerHTML = data.people.map((p) => `<tr><td>${esc(p.name)}</td><td class="n">${p.views}회</td></tr>`).join('')
        || '<tr><td colspan="2" class="muted">아직 참여자가 없어요.</td></tr>';
    }

    $('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      password = $('password').value;
      $('login-error').classList.remove('show');
      try { await load(); } catch (err) {
        $('login-error').textContent = err.message;
        $('login-error').classList.add('show');
      }
    });
    $('refresh').addEventListener('click', () => load().catch((err) => alert(err.message)));
    if (password) load().catch(() => {});
  </script>
</body>
</html>
